name: Feature request
description: Suggest something Prosetta could do.
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What you're trying to do
      description: The problem you're solving, in your own app's terms.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like Prosetta to do
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you've tried instead (optional)
